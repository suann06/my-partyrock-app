AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Taste of Malaysia — SAM template.
  Provisions:
    - S3 bucket for static frontend hosting
    - Lambda function (Python 3.12) for the /api/chat endpoint
    - API Gateway HTTP API with CORS pre-configured
    - IAM execution role with scoped bedrock:InvokeModel permission

# ── Parameters ────────────────────────────────────────────────────────────────
Parameters:

  # Passed in by the deploy workflow; safe to change per environment.
  BedrockRegion:
    Type: String
    Default: ap-southeast-5
    Description: AWS region used for Bedrock API calls

  ModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID (global inference profile)

  StageName:
    Type: String
    Default: prod
    AllowedValues: [prod, staging, dev]
    Description: API Gateway stage name

# ── Globals ───────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30          # Bedrock cold-start + inference; keep under API GW's 29 s hard limit
    MemorySize: 256
    Environment:
      Variables:
        BEDROCK_REGION: !Ref BedrockRegion
        MODEL_ID:       !Ref ModelId

# ── Resources ─────────────────────────────────────────────────────────────────
Resources:

  # ── 1. S3 bucket — static website hosting ──────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bucket name is auto-generated to stay globally unique.
      # The deploy workflow reads the name from stack Outputs.
      #
      # Public access is required for S3 static website hosting.
      # Access is controlled exclusively via FrontendBucketPolicy below.
      # The legacy AccessControl property is intentionally omitted to avoid W3045.
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true   # ACLs are not used; block them
        IgnorePublicAcls:      true
        BlockPublicPolicy:     false  # must be false so FrontendBucketPolicy can grant public GET
        RestrictPublicBuckets: false  # must be false to allow public reads via bucket policy
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html   # SPA: all 404s fall back to index.html
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [GET, HEAD]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  # Bucket policy — allow public GET on all objects (static site)
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  # ── 2. IAM role for the Lambda function ────────────────────────────────────
  ChatLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "taste-of-malaysia-lambda-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Gives Lambda permission to write logs to CloudWatch
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowBedrockInvoke
                Effect: Allow
                Action: bedrock:InvokeModel
                # Scope to the exact model — change if you switch models
                Resource:
                  - !Sub "arn:aws:bedrock:${BedrockRegion}::foundation-model/${ModelId}"
                  # Global inference profile ARN pattern
                  - !Sub "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku*"

  # ── 3. Lambda function ──────────────────────────────────────────────────────
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "taste-of-malaysia-chat-${StageName}"
      Description: "Handles POST /api/chat — calls Amazon Bedrock and returns a reply"
      # Path is relative to the SAM template file (infra/template.yaml).
      # SAM resolves: infra/ → ../backend/lambda
      CodeUri: ../backend/lambda
      Handler: chat.handler
      Role: !GetAtt ChatLambdaRole.Arn
      Events:
        # Handle the actual POST
        ChatPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatApi
            Path: /api/chat
            Method: POST
        # Handle CORS preflight OPTIONS (API GW HTTP API can auto-handle CORS,
        # but an explicit OPTIONS event ensures the Lambda also returns headers
        # when the auto-CORS header is not enough for all browsers)
        ChatOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChatApi
            Path: /api/chat
            Method: OPTIONS

  # ── 4. API Gateway HTTP API ─────────────────────────────────────────────────
  ChatApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Description: "Taste of Malaysia Chat API"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS
        MaxAge: 600

# ── Outputs ───────────────────────────────────────────────────────────────────
# The deploy.yml workflow reads these with `aws cloudformation describe-stacks`
# to inject the correct URLs before uploading the frontend to S3.
Outputs:

  FrontendBucketName:
    Description: "Name of the S3 bucket hosting the frontend"
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"

  FrontendWebsiteURL:
    Description: "Public URL of the S3 static website"
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-FrontendWebsiteURL"

  ChatApiUrl:
    Description: "API Gateway endpoint URL for POST /api/chat"
    Value: !Sub "https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/chat"
    Export:
      Name: !Sub "${AWS::StackName}-ChatApiUrl"
